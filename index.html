<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>BNI Attendance</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#1a1a1e"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="BNI Att."/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- ─── STYLES ───────────────────────────────────────────
     Tokens first, then base scaffolding, then one file
     per UI component. To restyle a component, open only
     its file in css/components/ — nothing else needs to
     change.
     ──────────────────────────────────────────────────── -->
<link rel="stylesheet" href="css/variables.css"/>
<link rel="stylesheet" href="css/base.css"/>
<link rel="stylesheet" href="css/components/topbar.css"/>
<link rel="stylesheet" href="css/components/search-field.css"/>
<link rel="stylesheet" href="css/components/member-row.css"/>
<link rel="stylesheet" href="css/components/fab.css"/>
<link rel="stylesheet" href="css/components/date-bar.css"/>
<link rel="stylesheet" href="css/components/stat-tiles.css"/>
<link rel="stylesheet" href="css/components/pals-pill.css"/>
<link rel="stylesheet" href="css/components/action-bar.css"/>
<link rel="stylesheet" href="css/components/record-row.css"/>
<link rel="stylesheet" href="css/components/modal.css"/>
<link rel="stylesheet" href="css/components/filter-modal.css"/>
<link rel="stylesheet" href="css/components/login.css"/>
<link rel="stylesheet" href="css/components/loading-toast.css"/>
</head>
<body>
<div class="phone" id="app">

  <!-- LOGIN -->
  <div class="screen active" id="screen-login">
    <div class="login-wrap">
      <div class="login-logo">BNI<span>.</span></div>
      <div class="login-sub">Edenite Chapter Attendance</div>
      <div style="width:100%">
        <div class="form-field">
          <label class="form-label">Email</label>
          <input class="form-input" id="login-email" type="email" placeholder="your@email.com" onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()"/>
        </div>
        <div class="form-field">
          <label class="form-label">Password</label>
          <input class="form-input" id="login-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
        </div>
        <div id="login-error" class="login-error"></div>
        <button class="login-btn" id="login-btn" onclick="doLogin()">Sign In</button>
      </div>
    </div>
  </div>

  <!-- LOADING -->
  <div class="screen" id="screen-loading">
    <div class="loading-screen">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-text">Loading...</div>
    </div>
  </div>

  <!-- HOME -->
  <div class="screen" id="screen-home">
    <div class="topbar">
      <div class="topbar-trail"></div>
      <div class="topbar-title">BNI Attendance</div>
      <button class="logout-btn" onclick="doLogout()">Sign out</button>
    </div>
    <div style="display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0;">
      <!-- STICKY TOP -->
      <div style="padding:16px 16px 0;background:var(--bg);flex-shrink:0;">
        <div class="search-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input class="search-input" id="home-search" placeholder="Search contacts" oninput="renderHomeMembers(this.value)"/>
        </div>
        <button class="add-member-btn" onclick="openAddMember()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14M5 12h14"/></svg>
          Add member
        </button>
        <div class="section-label">All Members</div>
        <div class="table-header">
          <span class="th th-sr">SR.</span>
          <span class="th th-name">NAMES</span>
          <span class="th th-actions">EDIT&nbsp;&nbsp;DELETE</span>
        </div>
      </div>
      <!-- SCROLLABLE LIST -->
      <div style="flex:1;overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch;">
        <div id="home-members-list"></div>
      </div>
    </div>
    <button class="fab-take" onclick="startAttendance()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
      Take attendance
    </button>
    <div class="bottom-nav">
      <button class="nav-item active" id="nav-h1" onclick="goHome()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Home
      </button>
      <button class="nav-item" id="nav-r1" onclick="goRecords()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Records
      </button>
    </div>
  </div>

  <!-- TAKE ATTENDANCE -->
  <div class="screen" id="screen-attendance">
    <div class="topbar">
      <button class="back-btn" onclick="backFromAttendance()"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11.25 14.3865L5.625 8.76147L11.25 3.13647" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="topbar-title">Take Attendance</div>
      <div class="topbar-trail"></div>
    </div>
    <div style="display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0;">
      <!-- STICKY TOP SECTION -->
      <div id="att-sticky-top" style="padding:16px 16px 0;background:var(--bg);flex-shrink:0;">
        <div class="date-bar" onclick="openDatePicker()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span class="date-bar-text" id="att-date-text"></span>
          <svg style="width:16px;height:16px;color:var(--text3)" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </div>
        <input type="date" id="att-date-input" onchange="onDateChange(this.value)"/>
        <div class="search-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input class="search-input" id="att-search" placeholder="Search contacts" oninput="renderAttMembers(this.value)"/>
        </div>
        <div id="att-stat-tiles"></div>
        <div class="att-table-header">
          <span class="att-th att-th-sr">Sr.</span>
          <span class="att-th att-th-name">Name</span>
          <span class="att-th att-th-status">Status</span>
        </div>
      </div>
      <!-- SCROLLABLE MEMBERS LIST -->
      <div id="att-scroll" style="flex:1;overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch;" onscroll="onAttScroll(this)">
        <div id="att-members-list"></div>
      </div>
    </div>
    <div class="action-bar">
      <button class="action-btn cancel" onclick="backFromAttendance()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        Cancel
      </button>
      <button class="action-btn save" id="save-record-btn" onclick="saveRecord()" style="opacity:0.4;cursor:pointer">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        Save Record
      </button>
    </div>
  </div>

  <!-- RECORDS -->
  <div class="screen" id="screen-records">
    <div class="topbar">
      <div class="topbar-trail"></div>
      <div class="topbar-title">Records</div>
      <div class="topbar-trail"></div>
    </div>
    <div class="body">
      <div class="section-label">All Records</div>
      <div class="search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-input" id="rec-search" placeholder="Search by date" oninput="renderRecords(this.value)"/>
      </div>
      <div id="records-list"></div>
    </div>
    <div class="bottom-nav">
      <button class="nav-item" id="nav-h2" onclick="goHome()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Home
      </button>
      <button class="nav-item active" id="nav-r2" onclick="goRecords()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Records
      </button>
    </div>
  </div>

  <!-- PAST RECORD -->
  <div class="screen" id="screen-past-record">
    <div class="topbar">
      <button class="back-btn" onclick="goRecords()"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11.25 14.3865L5.625 8.76147L11.25 3.13647" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="topbar-title">Past Record</div>
      <button class="delete-btn" id="delete-record-btn" onclick="deleteRecord()" style="display:none"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13.5 3.5H2.5" stroke="#606264" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 6.5V10.5" stroke="#606264" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 6.5V10.5" stroke="#606264" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 3.5V13C12.5 13.1326 12.4473 13.2598 12.3536 13.3536C12.2598 13.4473 12.1326 13.5 12 13.5H4C3.86739 13.5 3.74021 13.4473 3.64645 13.3536C3.55268 13.2598 3.5 13.1326 3.5 13V3.5" stroke="#606264" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.5 3.5V2.5C10.5 2.23478 10.3946 1.98043 10.2071 1.79289C10.0196 1.60536 9.76522 1.5 9.5 1.5H6.5C6.23478 1.5 5.98043 1.60536 5.79289 1.79289C5.60536 1.98043 5.5 2.23478 5.5 2.5V3.5" stroke="#606264" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div id="past-record-body" style="flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;"></div>
    <div class="action-bar" id="draft-resume-bar" style="display:none">
      <button class="action-btn save" style="flex:1;background:#111112;color:#fff" onclick="resumeDraft()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Resume Draft
      </button>
    </div>
    <!-- Saved record: Download + Edit (edit hidden if already edited once) -->
    <div class="action-bar" id="pdf-download-bar" style="display:none">
      <button class="action-btn cancel" id="edit-record-btn" onclick="enterEditMode()" style="border-right:1px solid var(--border)">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
        Edit
      </button>
      <button class="action-btn save" style="flex:1;background:#111112;color:#fff" onclick="downloadPDF()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Download PDF
      </button>
    </div>
    <!-- Edit mode action bar: Cancel + Save Changesss -->
    <div class="action-bar" id="edit-mode-bar" style="display:none">
      <button class="action-btn cancel" onclick="cancelEditMode()" style="border-right:1px solid var(--border)">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        Cancel
      </button>
      <button class="action-btn save" style="flex:1;background:#111112;color:#fff" onclick="saveEditedRecord()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        Save Changes
      </button>
    </div>
  </div>

  <div id="modal-root"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
